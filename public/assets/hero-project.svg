<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" fill="none">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1000" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#041E2F"/>
      <stop offset="60%" stop-color="#063A58"/>
      <stop offset="100%" stop-color="#07151D"/>
    </linearGradient>
    <pattern id="archGrid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#1479D1" stroke-width="0.75" stroke-opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1000" fill="url(#skyGrad)"/>
  <rect width="1600" height="1000" fill="url(#archGrid)"/>

  <!-- Architectural Structure Geometry (Modern Cantilever Residence) -->
  <!-- Ground Plane -->
  <line x1="100" y1="850" x2="1500" y2="850" stroke="#1479D1" stroke-width="2" stroke-opacity="0.5"/>
  <line x1="100" y1="860" x2="1500" y2="860" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.2"/>

  <!-- Main Concrete Pod (Ground Floor) -->
  <rect x="350" y="520" width="800" height="330" fill="#071E2D" stroke="#1479D1" stroke-width="1.5"/>
  
  <!-- Ribbon Glazing -->
  <rect x="380" y="550" width="340" height="260" fill="#0D354E" stroke="#1479D1" stroke-width="1" stroke-opacity="0.6"/>
  <line x1="490" y1="550" x2="490" y2="810" stroke="#1479D1" stroke-width="1" stroke-opacity="0.5"/>
  <line x1="600" y1="550" x2="600" y2="810" stroke="#1479D1" stroke-width="1" stroke-opacity="0.5"/>

  <!-- Cantilevered Upper Volume -->
  <polygon points="250,300 1200,300 1200,520 250,520" fill="#0A2C42" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8"/>
  <rect x="290" y="330" width="450" height="160" fill="#1479D1" fill-opacity="0.15" stroke="#1479D1" stroke-width="1"/>
  <line x1="440" y1="330" x2="440" y2="490" stroke="#1479D1" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="590" y1="330" x2="590" y2="490" stroke="#1479D1" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Structural Steel Columns -->
  <line x1="280" y1="520" x2="280" y2="850" stroke="#F4C542" stroke-width="3"/>
  <line x1="310" y1="520" x2="310" y2="850" stroke="#F4C542" stroke-width="3"/>

  <!-- Pergola / Louver System -->
  <line x1="780" y1="260" x2="1280" y2="260" stroke="#F4C542" stroke-width="2" stroke-opacity="0.8"/>
  <line x1="820" y1="260" x2="820" y2="300" stroke="#F4C542" stroke-width="1.5" stroke-opacity="0.8"/>
  <line x1="880" y1="260" x2="880" y2="300" stroke="#F4C542" stroke-width="1.5" stroke-opacity="0.8"/>
  <line x1="940" y1="260" x2="940" y2="300" stroke="#F4C542" stroke-width="1.5" stroke-opacity="0.8"/>
  <line x1="1000" y1="260" x2="1000" y2="300" stroke="#F4C542" stroke-width="1.5" stroke-opacity="0.8"/>
  <line x1="1060" y1="260" x2="1060" y2="300" stroke="#F4C542" stroke-width="1.5" stroke-opacity="0.8"/>
  <line x1="1120" y1="260" x2="1120" y2="300" stroke="#F4C542" stroke-width="1.5" stroke-opacity="0.8"/>
  <line x1="1180" y1="260" x2="1180" y2="300" stroke="#F4C542" stroke-width="1.5" stroke-opacity="0.8"/>

  <!-- Compass & Blueprint Annotations -->
  <circle cx="1400" cy="200" r="60" stroke="#1479D1" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
  <line x1="1400" y1="130" x2="1400" y2="270" stroke="#1479D1" stroke-width="1"/>
  <line x1="1330" y1="200" x2="1470" y2="200" stroke="#1479D1" stroke-width="1"/>
  <polygon points="1400,140 1395,160 1405,160" fill="#F4C542"/>
  <text x="1400" y="125" font-family="monospace" font-size="14" fill="#F4C542" text-anchor="middle">N</text>

  <!-- Title Block (Architectural Border) -->
  <rect x="80" y="80" width="1440" height="840" fill="none" stroke="#1479D1" stroke-width="1" stroke-opacity="0.3"/>
  <rect x="1100" y="740" width="390" height="150" fill="#041E2F" stroke="#F4C542" stroke-width="1" stroke-opacity="0.6"/>
  <text x="1120" y="775" font-family="sans-serif" font-weight="700" font-size="18" fill="#FFFFFF" letter-spacing="2">INFINITY SPACE GROUP</text>
  <text x="1120" y="800" font-family="sans-serif" font-size="11" fill="#F4C542" letter-spacing="3">ARCHITECTS | ENGINEERS | CONTRACTORS</text>
  <text x="1120" y="825" font-family="monospace" font-size="11" fill="#94A3B8">CONCEPT SCHEMATIC // RANCHI, JHARKHAND</text>
  <text x="1120" y="845" font-family="monospace" font-size="10" fill="#64748B">DWG NO: ISG-2026-HERO-01 • SCALE 1:100</text>
  <text x="1120" y="865" font-family="monospace" font-size="9" fill="#1479D1">REAL PROJECT MEDIA WILL BE ADDED</text>
</svg>
